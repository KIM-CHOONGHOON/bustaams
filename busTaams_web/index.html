<!doctype html>

  <head>
    <script type="text/javascript">
      // 이니시스 SDK의 고질적인 toLowerCase 에러 방지용 보호 코드
      (function() {
        var orgGetAttribute = HTMLScriptElement.prototype.getAttribute;
        HTMLScriptElement.prototype.getAttribute = function(name) {
          var val = orgGetAttribute.apply(this, arguments);
          if (name === 'src' && val === null) return '';
          return val;
        };
      })();

      // 이전 개발 테스트 포트 충돌로 인한 서비스 워커 강제 초기화 코드
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister();
            console.log('[Antigravity Clean] 이전 프로젝트 서비스 워커 해제 성공:', registration);
          }
        });
      }


    </script>
