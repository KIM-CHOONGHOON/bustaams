<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>결제 취소</title>
</head>
<body>
    <script>
        // 결제창이 팝업으로 열렸을 경우를 대비한 처리
        try {
            if (window.opener) {
                // 부모 창에 알림 (필요시)
                console.log('Payment closed by user');
            }
            window.close();
        } catch (e) {
            console.error('Window close failed:', e);
        }

        // 만약 창이 닫히지 않았을 경우(팝업이 아닐 때)를 대비해 이전 페이지로 이동
        setTimeout(function() {
            if (!window.closed) {
                history.back();
            }
        }, 500);
    </script>
</body>
</html>
