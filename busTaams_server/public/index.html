<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>전세 버스 영업 대행 서비스.</title>
    <meta property="og:title" content="전세 버스 영업 대행 서비스." />
    <!-- PWA Settings -->
    <link rel="manifest" href="/app/manifest.json" />
    <link rel="icon" type="image/png" href="/app/icon-512.png" />
    <meta name="theme-color" content="#0052cc" />
    <link rel="apple-touch-icon" href="/app/icon-512.png" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/app/sw.js')
            .then(registration => {
              console.log('App SW Registered');
              
              // 새로운 서비스 워커가 대기 중일 때 업데이트 실행
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('New content available, reloading...');
                    window.location.reload();
                  }
                });
              });
            })
            .catch(err => console.log('App SW Reg Error', err));
        });

        // 새로운 서비스 워커로 제어권이 넘어갔을 때 페이지 새로고침
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            window.location.reload();
            refreshing = true;
          }
        });
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <!-- KG Inicis Standard Pay SDK -->
    <script src="https://stdpay.inicis.com/stdjs/INIStdPay.js" charset="UTF-8"></script>
    <script type="module" crossorigin src="/app/assets/index-DLUEvEAn.js"></script>
    <link rel="stylesheet" crossorigin href="/app/assets/index-CwowRDlV.css">
  </head>
  <body class="bg-background font-body text-on-background min-h-screen">
    <div id="root"></div>
  </body>
</html>
